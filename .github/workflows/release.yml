name: Build & Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Extract version from tag
        id: ver
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag must be vX.Y.Z (got: $GITHUB_REF_NAME)"
            exit 1
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

      # 1) 版本注入：pyproject.toml + updater.py + installer.iss
      - name: Patch version sources
        shell: bash
        env:
          VER: ${{ steps.ver.outputs.version }}
        run: python scripts/patch_updater.py

      # 2) 构建前一致性检查：此时还没有 manifest，不加 --manifest-required
      - name: Verify version sources
        shell: bash
        env:
          VER: ${{ steps.ver.outputs.version }}
        run: python scripts/check_version.py

      - name: Build exe (PyInstaller onefile)
        run: pyinstaller build/app.spec --noconfirm --clean

      - name: Verify single-file exe
        shell: bash
        run: |
          if [ ! -f dist/DesktopCalendar.exe ]; then
            echo "::error::Expected single-file exe at dist/DesktopCalendar.exe"
            ls -la dist/ || true
            exit 1
          fi
          SIZE=$(stat -c%s dist/DesktopCalendar.exe)
          echo "OK: dist/DesktopCalendar.exe = $SIZE bytes"
          [ "$SIZE" -ge 1000000 ] || { echo "::error::exe too small"; exit 1; }

      # 3) Inno Setup：/DMyAppVersion 保留，作为 #define 的显式覆盖，
      #    与 patch 双重保险（两者一致，check 已断言）
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
              /DMyAppVersion=${{ steps.ver.outputs.version }} build\installer.iss
          $setup = Get-ChildItem dist/DesktopCalendar_Setup_*.exe -ErrorAction SilentlyContinue
          if (-not $setup) {
            Write-Error "Inno Setup did not produce dist/DesktopCalendar_Setup_*.exe"
            Get-ChildItem dist/ | Format-Table
            exit 1
          }
          Write-Host "OK: $($setup.Name) ($($setup.Length) bytes)"

      # 4) manifest 由脚本生成，schema 唯一来源
      - name: Generate update manifest
        shell: bash
        env:
          VER: ${{ steps.ver.outputs.version }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/patch_updater.py --manifest

      # 5) 构建后一致性检查：manifest 已存在，强制校验
      - name: Verify version + manifest
        shell: bash
        env:
          VER: ${{ steps.ver.outputs.version }}
        run: python scripts/check_version.py --manifest-required

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/DesktopCalendar.exe
            dist/version.json
            dist/DesktopCalendar_Setup_*.exe
          generate_release_notes: true